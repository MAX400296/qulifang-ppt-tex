name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qulifang-ppt-tex
        uses: actions/checkout@v4

      - name: Checkout qulifang-to-tex dependency
        uses: actions/checkout@v4
        with:
          repository: MAX400296/qulifang-to-tex
          path: dependency

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check Pillow PyYAML

      - name: Prepare sibling dependency
        run: cp -R dependency/skills/qulifang-to-tex skills/qulifang-to-tex

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          skill = Path("skills/qulifang-ppt-tex/SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---", skill, re.DOTALL)
          assert match, "SKILL.md 缺少 YAML frontmatter"
          metadata = yaml.safe_load(match.group(1))
          assert metadata["name"] == "qulifang-ppt-tex"
          assert isinstance(metadata.get("description"), str) and metadata["description"].strip()
          PY

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s skills/qulifang-ppt-tex/scripts/tests -p 'test_*.py'
